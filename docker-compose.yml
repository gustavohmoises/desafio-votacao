services:
  postgres:
    image: postgres:16
    container_name: votacao-postgres

    environment:
      POSTGRES_DB: votacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    container_name: votacao-api
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      DATABASE_URL: jdbc:postgresql://postgres:5432/votacao
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

volumes:
  postgres_data: